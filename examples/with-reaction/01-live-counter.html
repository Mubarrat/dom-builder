<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Counter — Dom-Builder + Observable</title>
  <script src="../../dist/dom.js"></script>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    .counter { display: flex; align-items: center; gap: 1rem; }
    button { padding: 0.4rem 1rem; font-size: 1.2rem; cursor: pointer; border-radius: 4px; border: 1px solid #aaa; }
    .value { font-size: 2.5rem; min-width: 3rem; text-align: center; }
  </style>
</head>
<body>
  <script>
    // Declare reactive state.
    const count = observable(0);

    // The display updates automatically whenever `count` changes.
    const display = $html.span({ class: "value" }, count);

    const app = $html.div({ class: "counter" },
      $html.button({ onclick: () => count(count() - 1) }, "−"),
      display,
      $html.button({ onclick: () => count(count() + 1) }, "+"),
      $html.button({ onclick: () => count(0) }, "Reset")
    );

    document.body.append(
      $html.h1("Live Counter"),
      app
    );
  </script>
</body>
</html>
